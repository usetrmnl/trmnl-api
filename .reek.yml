exclude_paths:
  - tmp
  - vendor

detectors:
  BooleanParameter:
    exclude:
      - TRMNL::API::Models::Display#initialize
  DataClump:
    exclude:
      - TRMNL::API::Requester
  ControlParameter:
    exclude:
      - TRMNL::API::Endpoints::Firmware::Latest#call
  LongParameterList:
    enabled: false
  TooManyStatements:
    exclude:
      - TRMNL::API::Requester#call
